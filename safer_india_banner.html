<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together for Safer India</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('safer_india_background.png'); /* Replace with the actual path to your image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #004d99; /* A dark blue color for the text */
            text-align: center;
        }
        .banner-text {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            background-color: rgba(0, 77, 153, 0.5); /* Semi-transparent dark blue */
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }
        .back-link:hover {
            background-color: rgba(0, 77, 153, 0.7);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Safe India</a>
    <div class="banner-text">
        TOGETHER<br>FOR SAFER<br>INDIA
    </div>

</html>
